    <rect x="55" y="330" width="260" height="210" rx="18" fill="#06131d" fill-opacity=".82" stroke="#3d887f"/>
    <circle cx="82" cy="358" r="5" fill="#ef6b68"/><circle cx="100" cy="358" r="5" fill="#f2c14e"/><circle cx="118" cy="358" r="5" fill="#65d98d"/>
    <text x="78" y="402" fill="#9bd9cc">WORLD PROMPT</text>
    <text x="78" y="438" fill="#f5f2df">resources: clustered</text>
    <text x="78" y="470" fill="#f5f2df">pressure: toxin_wave</text>
    <text x="78" y="502" fill="#f7c84b">intent → validated graph</text>
    <rect x="885" y="330" width="260" height="210" rx="18" fill="#06131d" fill-opacity=".82" stroke="#3d887f"/>
    <text x="910" y="370" fill="#9bd9cc">RULE GRAPH v3</text>
    <text x="910" y="406" fill="#f5f2df">A → grazer</text>
    <text x="910" y="438" fill="#f5f2df">B → hunter</text>
    <text x="910" y="470" fill="#61e6b6">B consumes A</text>
    <text x="910" y="502" fill="#f7c84b">patches: bounded</text>
  </g>
  <g filter="url(#soft)" opacity=".35"><ellipse cx="600" cy="730" rx="270" ry="85" fill="#2ff2bd"/></g>
  <g>
