    <text x="600" y="160" font-size="132" letter-spacing="-8" text-anchor="start" fill="#f7c84b">pot</text>
    <text x="600" y="208" font-size="17" letter-spacing="5" text-anchor="middle" fill="#b6d9d0">BOUNDED ARTIFICIAL LIFE · REPLAYABLE EVOLUTION</text>
  </g>
