<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">LifePot</title>
  <desc id="desc">A luminous ecosystem growing inside a potion bottle, surrounded by bounded rule and replay signals.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="72%"><stop offset="0" stop-color="#102f31"/><stop offset=".42" stop-color="#071a25"/><stop offset="1" stop-color="#030811"/></radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff0a8"/><stop offset=".45" stop-color="#f7c84b"/><stop offset="1" stop-color="#b77516"/></linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#99fff1" stop-opacity=".42"/><stop offset=".35" stop-color="#123e51" stop-opacity=".3"/><stop offset="1" stop-color="#85ffd1" stop-opacity=".12"/></linearGradient>
    <radialGradient id="liquid" cx="48%" cy="35%" r="72%"><stop stop-color="#51f5bf" stop-opacity=".8"/><stop offset=".38" stop-color="#0ea79a" stop-opacity=".72"/><stop offset="1" stop-color="#063342" stop-opacity=".92"/></radialGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="18"/></filter>
    <clipPath id="bottleClip"><path d="M475 355 C455 400 385 425 365 520 C337 652 422 750 600 758 C778 750 863 652 835 520 C815 425 745 400 725 355 L725 290 L475 290 Z"/></clipPath>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#8fffe2" stroke-opacity=".12" stroke-width="1"/></pattern>
  </defs>
  <rect width="1200" height="900" fill="url(#bg)"/>
  <g fill="#fff" opacity=".65">
    <circle cx="75" cy="98" r="1.4"/><circle cx="178" cy="162" r="1"/><circle cx="1040" cy="123" r="1.7"/><circle cx="1110" cy="260" r="1"/><circle cx="950" cy="395" r="1.4"/><circle cx="142" cy="430" r="1.3"/><circle cx="260" cy="736" r="1.5"/><circle cx="1025" cy="720" r="1.4"/><circle cx="818" cy="86" r="1.1"/><circle cx="350" cy="110" r="1.2"/>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" font-weight="700">
