name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
      options: --init --shm-size=1g
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Trust this mounted checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --test scripts/prepare-playwright-mirrors.test.mjs scripts/dependency-compat.test.mjs scripts/playwright-ci.test.mjs
      # Match the bounded local gate without weakening any per-test deadline.
      - run: npm test -- --maxWorkers=2
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build:cloudflare
      - run: npm run test:cloudflare

  browser:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
      options: --init --shm-size=1g
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v7
      - name: Trust this mounted checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Test discovery imports embedded guides before Playwright starts Next.js.
      - run: npm run predev
      - run: npm run test:e2e -- --shard="$PLAYWRIGHT_SHARD/2"
        env:
          PLAYWRIGHT_SHARD: ${{ matrix.shard }}

  # Keep the existing check name and fail closed on a failed/skipped dependency.
  verify:
    if: ${{ always() }}
    needs: [checks, browser]
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Require all verification jobs to succeed
        env:
          CHECKS_RESULT: ${{ needs.checks.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
        run: test "$CHECKS_RESULT" = success && test "$BROWSER_RESULT" = success
