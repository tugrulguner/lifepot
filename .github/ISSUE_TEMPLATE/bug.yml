name: Bug report
description: Report a reproducible LifePot defect
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for helping make LifePot reproducible and inspectable.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the observed behavior and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include setup answers, seed or replay link, exact steps, and whether live Jev or fallback was used.
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: Commit or deployment
      placeholder: Commit SHA or URL
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Browser, operating system, Node version, and relevant configuration without secrets.
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Logs, screenshots, failing tests, replay rejection, or snapshots. Remove secrets.
